name: Hardening

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'manifest.json'
      - 'manifesto.github.vars.json'
      - 'CMakeLists.txt'
      - '.github/actions/setup-manifesto/**'
      - '.github/workflows/hardening.yml'
  push:
    paths:
      - 'app/**'
      - 'core/**'
      - 'manifest.json'
      - 'manifesto.github.vars.json'
      - 'CMakeLists.txt'
      - '.github/actions/setup-manifesto/**'
      - '.github/workflows/hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pinned toolchain
        id: manifesto
        uses: ./.github/actions/setup-manifesto
        with:
          bootstrap: repository
          source-path: '.'
          # Keep these selectors aligned with manifesto.github.vars.json.
          manifesto-repository: ninjaro/ecosystem
          manifesto-ref: b646833b17ff1e5036a6fd8a6d7e75bdb1eb9914
          build-parallelism: 2
          install-project-deps: 'true'

      - name: Record resolved dependency versions
        shell: bash
        env:
          TOOL_SOURCE: ${{ steps.manifesto.outputs.manifesto-source-root }}
        run: |
          report_root=".ecosystem/github/reports/00-toolchain"
          mkdir -p "$report_root"
          {
            cmake --version | head -n 1
            clang++ --version | head -n 1
            qmake -query QT_VERSION
            pkg-config --modversion opencv4
            printf '%s\n' 'nlohmann_json 3.12.0 (canonical bootstrap prerequisite)'
            printf 'tooling source %s\n' "$TOOL_SOURCE"
            git -C "$TOOL_SOURCE" rev-parse HEAD
          } > "$report_root/versions.txt"

      - name: Generate and verify standalone build surface
        shell: bash
        run: |
          "${{ steps.manifesto.outputs.marx-binary }}" sync
          if grep -Fq '.ecosystem/source/CMakeLists.txt' CMakeLists.txt; then
            echo 'Tracked CMake still depends on ignored generated files.' >&2
            exit 1
          fi
          cmake -S . -B build-standalone -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug
          # The outer facade builds the real Monitor/Packing provider closure
          # and its application; app__app belongs to the inner graph only.
          cmake --build build-standalone --parallel 2
          cmake --install build-standalone --prefix "$PWD/.ecosystem/hardening-sdk"

      - name: Run canonical sanitizer check
        shell: bash
        run: |
          # sync supplies tracked surfaces; Engels creates the developer graph
          # and selects its actual test targets for ASan/UBSan/LSan checks.
          export CMAKE_PREFIX_PATH="$PWD/.ecosystem/hardening-sdk${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          "${{ steps.manifesto.outputs.engels-binary }}" check leaks

      - name: Require complete authored test-source coverage
        shell: bash
        run: |
          # Require all 54 authored translation units after B1/B1.1 adoption.
          # Fail explicitly if hosted tooling still emits an incomplete suite.
          # This checks coverage; it does not supply missing targets.
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          commands = json.loads(Path('.ecosystem/build/project/desktop/debug/leaks/compile_commands.json').read_text())
          compiled = {(Path(item['directory']) / item['file']).resolve() for item in commands}
          authored = {path.resolve() for area in ('core/tests', 'app/tests')
                      for path in (root / area).rglob('*.cpp')}
          missing = sorted(str(path.relative_to(root)) for path in authored - compiled)
          report = Path('.ecosystem/github/reports/hardening/test-source-coverage.json')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({'authored': len(authored), 'missing': missing}, indent=2) + '\n')
          if missing:
              print('\n'.join(missing))
              raise SystemExit('::error::Incomplete sanitizer test-source coverage; see test-source-coverage.json.')
          PY

      - name: Repeat sanitizer tests with strict string checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir .ecosystem/build/project/desktop/debug/leaks --output-on-failure --no-tests=error

      - name: Upload dependency and sanitizer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yodau-hardening-evidence
          path: |
            .ecosystem/github/reports/00-toolchain/versions.txt
            .ecosystem/github/reports/hardening/
            .ecosystem/build/project/desktop/debug/leaks/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
